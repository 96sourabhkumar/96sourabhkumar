name: Update project list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/update_repos.py"
      - ".github/workflows/update-repos.yml"

concurrency:
  group: profile-readme-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # Repos to always show first (comma-separated, in order):
          PINNED: "fft-radar-3d-engine,ecg-arrhythmia-classifier,can-esim,esp32-wireless-buggy-control,hand-gesture-recognition"
          # Repos to hide (comma-separated):
          EXCLUDE: "skumar3be24-ux"
          MAX_REPOS: "30"
        run: python scripts/update_repos.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update project list"
          git pull --rebase origin main
          git push
